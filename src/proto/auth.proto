syntax = "proto3";

package auth;

service AuthService {
  rpc LoginWithGoogle (GoogleLoginRequest) returns (AuthResponse);
}

message GoogleLoginRequest {
  string id_token = 1;
}

message UserDto {
  string id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
}

message AuthResponse {
  string message = 1;
  string token = 2;
  string access_token = 3;
  string refresh_token = 4;
  UserDto user = 5;
}
