services:
  repar-tir-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repar-tir-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-repar-tir-docker-jwt-secret-2026}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-repar-tir-docker-refresh-secret-2026}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - repar_tir_sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  repar_tir_sqlite_data:
